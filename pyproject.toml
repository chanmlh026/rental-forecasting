[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-forecasting"
version = "0.1.0"
description = "Forecast private rental prices across Local Authorities in England."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "ingestion*",
    "processing*",
    "features*",
    "models*",
    "evaluation*",
    "pipelines*",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
